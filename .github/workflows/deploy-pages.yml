name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Cloud-only Pages: build from committed static assets only
      # (src/data/*.json + public/sounds/*.ogg). Never run extract/Playwright/ffmpeg.
      - run: npm ci
      - name: Verify committed merchant assets
        run: |
          test -f src/data/merchantData.json
          test -f src/data/fingerprints.json
          count=$(find public/sounds -name '*.ogg' | wc -l)
          echo "ogg count=$count"
          test "$count" -eq 76
      - run: GITHUB_PAGES=1 npm run build
      - name: Verify dist includes reference audio
        run: |
          count=$(find dist/sounds -name '*.ogg' | wc -l)
          echo "dist ogg count=$count"
          test "$count" -eq 76
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
